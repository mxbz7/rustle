<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Whisper Chat</title>
<style>
:root{--bg:#14201c;--card:#1c2d27;--ink:#eef3f0;--mut:#9db3a9;--acc:#3ecf9a;--line:#2a4038;--them:#243a32}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.hidden{display:none!important}
button{font:inherit;border:0;border-radius:12px;padding:12px 20px;background:var(--acc);color:#07241a;font-weight:650;cursor:pointer}
.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.link{background:none;color:var(--mut);font-weight:400;text-decoration:underline;padding:4px}
input{flex:1;min-width:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px}
#landing{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#landing img{width:96px;height:96px;border-radius:22px}
#landing h1{margin:0;font-size:30px}
#landing p{margin:0;color:var(--mut);max-width:360px}
#ios{font-size:14px;color:var(--mut);max-width:320px}
.screen{height:100%;display:flex;flex-direction:column}
header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:18px}
#status{font-size:12px;color:var(--mut)}
#me{font:12px ui-monospace,Menlo,monospace;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:99px;font-weight:400}
.back{padding:6px 12px;background:none;color:var(--ink);font-size:20px}
#title{flex:1;font-weight:650;font-size:17px;cursor:pointer}
.scroll{flex:1;overflow-y:auto;padding:12px 14px}
.empty{color:var(--mut);text-align:center;margin-top:40px}
.bar{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
.ct{display:flex;justify-content:space-between;gap:10px;padding:12px;background:var(--card);border-radius:14px;margin-bottom:8px;cursor:pointer}
.ct .n{font-weight:650}.ct .p{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.ct .t{color:var(--mut);font-size:12px;white-space:nowrap}
#msgs{display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 11px;border-radius:14px;background:var(--them);word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:#1f7a5e}
.m small{display:block;font-size:11px;opacity:.7;text-align:right}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sheet .box{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#sheet h2{margin:0;font-size:18px}
.full{font:14px/1.5 ui-monospace,Menlo,monospace;word-break:break-all;user-select:all;-webkit-user-select:all;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.two{display:flex;gap:8px}.two button{flex:1}
#toast{font-size:13px;color:var(--acc);min-height:18px}
</style>
</head>
<body>

<section id="landing" class="hidden">
  <img src="icon-192.png" alt="">
  <h1>Whisper Chat</h1>
  <p>Private, end-to-end encrypted messaging. No accounts, no company server.</p>
  <button id="install" class="hidden" type="button">Install app</button>
  <div id="ios" class="hidden">On iPhone: tap Share, then “Add to Home Screen”.</div>
  <button class="link" id="preview" type="button">Open in browser instead</button>
</section>

<section id="home" class="screen hidden">
  <header><div><b>Whisper</b><div id="status">starting…</div></div><button id="me" type="button">My ID · tap</button></header>
  <div class="scroll" id="list"></div>
  <div class="bar"><input id="pk" placeholder="Paste a friend’s ID…" autocomplete="off"><button id="add" type="button">Add</button></div>
</section>

<section id="thread" class="screen hidden">
  <header><button class="back" id="back" type="button">‹</button><div id="title"></div><div id="status2"></div></header>
  <div class="scroll" id="sc"><div id="msgs"></div></div>
  <div class="bar"><input id="txt" placeholder="Message…" autocomplete="off"><button id="send" type="button">Send</button></div>
</section>

<div id="sheet" class="hidden"><div class="box">
  <h2>Your ID</h2>
  <div class="full" id="full"></div>
  <div class="two"><button id="copy" type="button">Copy ID</button><button id="share" class="alt" type="button">Share link</button></div>
  <div id="toast"></div>
  <button class="alt" id="close" type="button">Close</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.7.2/lib/nostr.bundle.js"></script>
<script>
const $ = id => document.getElementById(id);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

let deferred;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; $("install").classList.remove("hidden"); });
$("install").onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $("install").classList.add("hidden"); };
if (/iphone|ipad/i.test(navigator.userAgent) && !standalone) $("ios").classList.remove("hidden");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

if (standalone || new URLSearchParams(location.search).has("app")) startApp();
else $("landing").classList.remove("hidden");
$("preview").onclick = () => { $("landing").classList.add("hidden"); startApp(); };

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const hexOf = u8 => [...u8].map(b => b.toString(16).padStart(2, "0")).join("");
const bytesOf = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const RELAYS = ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net", "wss://relay.nostr.band"];

let NT, sk, me, pool, subscription, contacts, msgs, seen, cur = null;

function startApp() {
  $("home").classList.remove("hidden");
  NT = window.NostrTools;
  contacts = store.get("w-contacts", {});
  msgs = store.get("w-msgs", {});
  seen = new Set(Object.values(msgs).flat().map(m => m.id));
  renderList();
  wireUi();
  if (!NT) { setStatus("Library failed to load. Check your internet and reopen."); return; }

  let skHex = store.get("w-sk", null);
  if (!skHex) { skHex = hexOf(NT.generateSecretKey()); store.set("w-sk", skHex); }
  sk = bytesOf(skHex);
  me = NT.getPublicKey(sk);
  $("full").textContent = me;

  pool = new NT.SimplePool();
  subscribe();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) subscribe(); });

  const m = location.hash.match(/add=([0-9a-f]{64})/i);
  if (m) { $("pk").value = m[1]; setStatus("ID filled in. Tap Add."); }
}

function setStatus(t) { $("status").textContent = t; }

function subscribe() {
  try { if (subscription) subscription.close(); } catch (e) {}
  setStatus("connecting…");
  subscription = pool.subscribeMany(RELAYS, [
    { kinds: [4], "#p": [me], limit: 300 },
    { kinds: [4], authors: [me], limit: 300 }
  ], { onevent: onEvent, oneose() { setStatus("connected"); } });
}

/* ---------- receiving ---------- */
async function onEvent(ev) {
  if (seen.has(ev.id)) return;
  const p = ev.tags.find(t => t[0] === "p");
  if (!p) return;
  let other;
  if (ev.pubkey === me) other = p[1];
  else if (p[1] === me) other = ev.pubkey;
  else return;
  if (!/^[0-9a-f]{64}$/.test(other)) return;
  let text;
  try { text = await NT.nip04.decrypt(sk, other, ev.content); } catch (e) { return; }
  if (!contacts[other]) { contacts[other] = "Friend " + other.slice(0, 6); store.set("w-contacts", contacts); }
  push(other, { id: ev.id, me: ev.pubkey === me, text, t: ev.created_at, st: "ok" });
}

function push(pk, m) {
  const list = msgs[pk] || (msgs[pk] = []);
  const old = list.find(x => x.id === m.id);
  if (old) old.st = m.st; else { list.push(m); list.sort((a, b) => a.t - b.t); }
  seen.add(m.id);
  store.set("w-msgs", msgs);
  renderList();
  if (cur === pk) renderThread();
}

/* ---------- sending ---------- */
async function sendMsg() {
  const text = $("txt").value.trim();
  if (!text || !cur) return;
  $("txt").value = "";
  const to = cur;
  try {
    const content = await NT.nip04.encrypt(sk, to, text);
    const ev = NT.finalizeEvent({ kind: 4, created_at: Math.floor(Date.now() / 1000), tags: [["p", to]], content }, sk);
    push(to, { id: ev.id, me: true, text, t: ev.created_at, st: "sending" });
    try { await Promise.any(pool.publish(RELAYS, ev)); push(to, { id: ev.id, me: true, text, t: ev.created_at, st: "ok" }); }
    catch (e) { push(to, { id: ev.id, me: true, text, t: ev.created_at, st: "failed" }); }
  } catch (e) { setStatus("Could not encrypt: " + e.message); }
}

/* ---------- contacts ---------- */
function parseId(raw) {
  raw = raw.trim();
  const link = raw.match(/add=([0-9a-f]{64})/i);
  if (link) return link[1].toLowerCase();
  if (/^npub1/i.test(raw)) { try { return NT.nip19.decode(raw.toLowerCase()).data; } catch (e) { return null; } }
  return /^[0-9a-f]{64}$/i.test(raw) ? raw.toLowerCase() : null;
}
function addContact() {
  if (!NT) { alert("Library not loaded yet. Check your internet."); return; }
  const raw = $("pk").value;
  const pk = parseId(raw);
  if (!pk) { alert("That doesn’t look like a valid ID. It should be 64 letters and numbers (a–f, 0–9). Copy it again from your friend’s “My ID” screen."); return; }
  if (pk === me) { alert("That’s your own ID. Paste your friend’s ID instead."); return; }
  if (!contacts[pk]) { contacts[pk] = "Friend " + pk.slice(0, 6); store.set("w-contacts", contacts); }
  $("pk").value = "";
  history.replaceState(null, "", location.pathname + location.search);
  renderList();
  openThread(pk);
}

/* ---------- UI ---------- */
function fmt(t) { const d = new Date(t * 1000); return d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : d.toLocaleDateString([], { day: "numeric", month: "short" }); }
function renderList() {
  const box = $("list"); box.textContent = "";
  const ids = Object.keys(contacts).sort((a, b) => ((msgs[b] || []).slice(-1)[0]?.t || 0) - ((msgs[a] || []).slice(-1)[0]?.t || 0));
  if (!ids.length) { const d = document.createElement("div"); d.className = "empty"; d.innerHTML = "No chats yet.<br>Paste a friend’s ID below and tap Add."; box.append(d); return; }
  for (const pk of ids) {
    const last = (msgs[pk] || []).slice(-1)[0];
    const row = document.createElement("div"); row.className = "ct";
    const l = document.createElement("div");
    const n = document.createElement("div"); n.className = "n"; n.textContent = contacts[pk];
    const p = document.createElement("div"); p.className = "p"; p.textContent = last ? (last.me ? "You: " : "") + last.text : "No messages yet";
    l.append(n, p);
    const t = document.createElement("div"); t.className = "t"; t.textContent = last ? fmt(last.t) : "";
    row.append(l, t); row.onclick = () => openThread(pk); box.append(row);
  }
}
function openThread(pk) { cur = pk; $("home").classList.add("hidden"); $("thread").classList.remove("hidden"); $("title").textContent = contacts[pk]; renderThread(); }
function renderThread() {
  const box = $("msgs"); box.textContent = "";
  const list = msgs[cur] || [];
  if (!list.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = "Say hello. Messages are encrypted before they leave this phone."; box.append(d); }
  for (const m of list) {
    const d = document.createElement("div"); d.className = "m" + (m.me ? " me" : ""); d.textContent = m.text;
    if (m.me && m.st !== "ok") { const s = document.createElement("small"); s.textContent = m.st === "failed" ? "not sent" : "sending…"; d.append(s); }
    box.append(d);
  }
  $("sc").scrollTop = $("sc").scrollHeight;
}
function wireUi() {
  $("add").onclick = addContact;
  $("pk").onkeydown = e => { if (e.key === "Enter") addContact(); };
  $("send").onclick = sendMsg;
  $("txt").onkeydown = e => { if (e.key === "Enter") sendMsg(); };
  $("back").onclick = () => { cur = null; $("thread").classList.add("hidden"); $("home").classList.remove("hidden"); renderList(); };
  $("title").onclick = () => { const n = prompt("Name for this contact:", contacts[cur]); if (n && n.trim()) { contacts[cur] = n.trim().slice(0, 30); store.set("w-contacts", contacts); $("title").textContent = contacts[cur]; } };
  $("me").onclick = () => $("sheet").classList.remove("hidden");
  $("close").onclick = () => $("sheet").classList.add("hidden");
  $("sheet").onclick = e => { if (e.target.id === "sheet") $("sheet").classList.add("hidden"); };
  const toast = t => { $("toast").textContent = t; setTimeout(() => $("toast").textContent = "", 2000); };
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(me); toast("ID copied"); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("full")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Press and hold to copy."); }
  };
  $("share").onclick = async () => {
    const link = location.origin + location.pathname + "#add=" + me;
    try { if (navigator.share) await navigator.share({ title: "Chat with me on Whisper", url: link }); else { await navigator.clipboard.writeText(link); toast("Link copied"); } } catch (e) {}
  };
}
</script>
</body>
</html>
